<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>New Outlet Prospect</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- HEADER FONT -->
    <link href="https://db.onlinewebfonts.com/c/575c5e6ac4113381b04ae19181e715d7?family=Corbel+W99+Bold" rel="stylesheet">

    <!-- SECTION TITLE FONT -->

    <!-- Bootstrap -->

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        /* ===== GLOBAL FONT ===== */
        body {
            font-family: "Corbel W99 Bold", Arial, sans-serif;
            background-color: #f7f7f7;
        }

        /* ===== HEADER ===== */
        .header-wrapper {
            position: relative;
            background: #fff;
        }

        .top-bar {
            height: 28px;
            background-color: #e31e24;
        }

        .header-logo {
            position: absolute;
            top: -8px;
            left: 32px;
            z-index: 10;
        }

        .header-logo img {
            height: 85px;
            width: auto;
        }

        .navbar-wall {
            background-color: #ffffff;
            padding-left: 120px;
            box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.1); /* Adjust these values as needed */
        }

        .navbar-nav .nav-link {
            color: #000;
            font-weight: 400;
            padding: 0;
            line-height: 1.2;
        }

        .navbar-nav .nav-link:hover {
            color: #e31e24;
        }

        .nav-link.active-red {
            color: #e31e24 !important;
            border-bottom: 3px solid #e31e24;
            padding-bottom: 20px;
        }

        .menu-spacing {
            gap: 2rem;
        }

        /* ===== SECTION TITLE ===== */
        .section-title {
            font-family: "Stick-A-Round W00Stick-A-Round", Arial, sans-serif;
            font-size: 2rem;
            color: #e31e24;
        }

        /* ===== FORM CARD ===== */
        .form-card {
            background: #fff;
            border-radius: 14px;
            padding: 24px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.08);
        }

        textarea {
            resize: none;
        }

        .btn-danger {
            background-color: #e31e24;
            border: none;
        }

        .btn-danger:hover {
            background-color: #c91a1f;
        }
    </style>
</head>
<body>

<!-- ================= HEADER ================= -->
<header class="header-wrapper">

    <div class="top-bar"></div>

    <!-- LOGO OVERLAP -->
    <a class="header-logo" href="#" title="Wall's header logo">
        <picture>
            <source
                srcset="https://assets.unileversolutions.com/v1/142767882.png?im=AspectCrop=(300,305);Resize=(300,305)"
                media="(min-width: 320px)">
            <img
                src="https://assets.unileversolutions.com/v1/142767882.png"
                alt="Wall's header logo"
                loading="eager">
        </picture>
    </a>

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-wall py-3">
        <div class="container-fluid px-4">

            <button class="navbar-toggler ms-auto" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="mainNavbar">

                <ul class="navbar-nav align-items-center me-auto menu-spacing ms-5">
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown">
                            Brand Kami
                        </a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="#">Feast</a></li>
                            <li><a class="dropdown-item" href="#">Magnum</a></li>
                            <li><a class="dropdown-item" href="#">In Home</a></li>
                            <li><a class="dropdown-item" href="#">Cornetto</a></li>
                            <li><a class="dropdown-item" href="#">Populaire</a></li>
                            <li><a class="dropdown-item" href="#">Paddle Pop</a></li>
                            <li><a class="dropdown-item" href="#">Others</a></li>
                        </ul>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">Es Krim</a>
                    </li>

                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown">
                            Tentang Wall's
                        </a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="#">Sejarah Wall's</a></li>
                            <li><a class="dropdown-item" href="#">Tujuan Mulia Kami</a></li>
                            <li><a class="dropdown-item" href="#">The Happiness Project</a></li>
                            <li><a class="dropdown-item" href="#">Kontak</a></li>
                        </ul>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">
                            Belanja Sekarang
                        </a>
                    </li>
                </ul>

                <a href="#" class="d-flex align-items-center gap-2 nav-link nav-item">
                    <i class="bi bi-search fs-5"></i>
                    <span>Mencari</span>
                </a>

            </div>
        </div>
    </nav>
</header>

<main class="container my-5">

    <h2 class="section-title mb-4">
        New Outlet Prospect
    </h2>

    <div class="form-card">
        <form>
            <div class="row g-3">

                <div class="col-md-6">
                    <label class="form-label">Nama Toko*</label>
                    <input type="text" class="form-control" required>
                </div>

                <div class="col-md-6">
                    <label class="form-label">Nama Pemilik Toko*</label>
                    <input type="text" class="form-control" required>
                </div>

                <div class="col-12">
                    <label class="form-label">Alamat Toko*</label>
                    <textarea class="form-control" required rows="3"></textarea>
                </div>

                <div class="col-md-6">
                    <label class="form-label">Nomor HP*</label>
                    <input type="tel" class="form-control" required>
                </div>

                <div class="col-md-6">
                    <label class="form-label">Jam Operasional Toko*</label>
                    <select class="form-select" required>
                        <option value="" selected disabled>Pilih</option>
                        <option>Diatas 15 jam</option>
                        <option>10 - 15 jam</option>
                        <option>Kurang dari 10 jam</option>
                    </select>
                </div>

                <div class="col-md-6">
                    <label class="form-label">Apakah toko menjual air galon / gas?*</label>
                    <select class="form-select" required>
                        <option value="" selected disabled>Pilih</option>
                        <option>Yes</option>
                        <option>No</option>
                    </select>
                </div>

                <div class="col-md-6">
                    <label class="form-label">Lokasi Toko Berada*</label>
                    <select class="form-select" required>
                        <option value="" selected disabled>Pilih</option>
                        <option>Jalan Utama</option>
                        <option>Jalan Kecil / Gang Perumahan</option>
                    </select>
                </div>

                <div class="col-md-6">
                    <label class="form-label">Jumlah toko lain di sekitar radius 20 meter*</label>
                    <select class="form-select" required>
                        <option value="" selected disabled>Pilih</option>
                        <option>Lebih dari 2 toko</option>
                        <option>Kurang dari 2 toko</option>
                    </select>
                </div>

                <div class="col-md-6">
                    <label class="form-label">Jumlah Stock Rokok*</label>
                    <select class="form-select" required>
                        <option value="" selected disabled>Pilih</option>
                        <option>> 150 pcs</option>
                        <option>50 - 150 pcs</option>
                        <option>< 50 pcs</option>
                        <option>Tidak jual rokok</option>
                    </select>
                </div>

                <div class="col-md-6">
                    <label class="form-label d-block">
                        Ketuk tombol di bawah untuk membagikan lokasi toko*
                    </label>
                    <button type="button" class="btn btn-outline-danger py-5 w-100">
                        Ambil Lokasi Toko (GPS)
                    </button>
                </div>

                <div class="col-md-6">
                    <label class="form-label d-block">
                        Foto toko (Tampak depan dan terlihat barang dagangan)*
                    </label>
                    <button type="button" class="btn btn-outline-danger py-5 w-100">
                        Ambil Foto (Live Camera + GPS)
                    </button>
                </div>

                <div class="col-12">
                    <button type="submit" class="btn btn-danger w-100">Submit</button>
                </div>
            </div>
        </form>
    </div>

</main>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
